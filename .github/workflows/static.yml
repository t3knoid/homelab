name: Build and Deploy Jekyll Site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Match local Ruby (3.3.7) to avoid version incompatibilities
          ruby-version: '3.3.7'
          bundler-cache: true

      - name: Install Jekyll and dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ./_site

      - name: Debug _site contents
        run: ls -R ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  linkcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run link checker
        run: |
          python3 .github/scripts/linkcheck.py

      - name: Add summary to GitHub UI
        run: |
          echo "## Link Checker Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat link-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Commit static HTML report to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin gh-pages
          git checkout gh-pages

          mkdir -p reports
          cp link-report.html reports/link-report.html

          git add reports/link-report.html
          git commit -m "Update link report [skip ci]" || echo "No changes"
          git push origin gh-pages
