title: Homelab Documentation
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
highlighter: rouge
plugins:
  - jekyll-relative-links
  - jemoji
theme: minima
relative_links:
  enabled: true
  collections: true
baseurl: "/"
header_pages:
  - index.md
  - ansible.md
  - proxmox.md
  - reverse-proxy.md
  - certificates.md
linkedin_username: frefol
github_username: t3knoid
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "index.md"
    values:
      layout: "home"

# Live status strip on the home page (_includes/home-live-status.html).
# url: Grafana externally shared dashboard link. Leave empty to hide the strip.
home_status:
  title: "Homelab Status"
  url: "https://grafana.refol.us/public-dashboards/703ed200b94a457b8ed0355c66d5739c"
  theme: "light"
  from: "now-6h"
  height: 320
  mobile_height: 420
  wide_width: 1180