<!-- Live status strip: embeds the Grafana externally shared ("public") dashboard set in _config.yml (home_status).
     Leave home_status.url empty to hide the strip. -->
{%- assign hs = site.home_status -%}
{%- if hs and hs.url and hs.url != "" -%}
<style>
  .hl-live{margin:1.4rem 0 .4rem;border:1px solid #d8dee4;border-radius:14px;padding:12px 14px 14px;background:#fbfcfd}
  .hl-live-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .hl-live-title{font-weight:700;display:flex;align-items:center;gap:8px}
  .hl-badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:#1a7f37;background:#dafbe1;border-radius:999px;padding:3px 9px}
  .hl-dot{width:8px;height:8px;border-radius:50%;background:#1a7f37;animation:hl-pulse 1.6s ease-out infinite}
  @keyframes hl-pulse{0%{box-shadow:0 0 0 0 rgba(26,127,55,.6)}100%{box-shadow:0 0 0 8px rgba(26,127,55,0)}}
  @media (prefers-reduced-motion:reduce){.hl-dot{animation:none}}
  .hl-live-head a{font-size:.85rem;font-weight:600;color:#0969da;text-decoration:none}
  .hl-live-frame{position:relative;border-radius:10px;overflow:hidden;border:1px solid #e4e8ec;background:#fff;
    height:{{ hs.height | default: 220 }}px}
  .hl-live-frame iframe{width:100%;height:100%;border:0;display:block}
  /* Wide screens: let the strip extend past the text column so Grafana has room for its header and panels */
  @media (min-width:1200px){.hl-live{width:min({{ hs.wide_width | default: 1180 }}px, calc(100vw - 80px));position:relative;left:50%;transform:translateX(-50%)}}
  @media (max-width:760px){.hl-live-frame{height:{{ hs.mobile_height | default: 420 }}px}}
</style>
<section class="hl-live" aria-label="Live platform status">
  <div class="hl-live-head">
    <div class="hl-live-title">📡 {{ hs.title | default: "Homelab Status" }}
      <span class="hl-badge"><span class="hl-dot"></span>Live</span></div>
    <a href="{{ hs.url }}" target="_blank" rel="noopener">Open full dashboard →</a>
  </div>
  <div class="hl-live-frame">
    <iframe src="{{ hs.url }}{% if hs.url contains '?' %}&{% else %}?{% endif %}theme={{ hs.theme | default: 'light' }}&from={{ hs.from | default: 'now-6h' }}&to=now"
            title="{{ hs.title | default: 'Homelab Status' }} (live Grafana dashboard)"
            loading="lazy" referrerpolicy="no-referrer"></iframe>
  </div>
</section>
{%- endif -%}
